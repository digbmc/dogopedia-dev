<h2 id="между-собакой-и-волком">Между собакой и волком</h2>

<ul>
  <li>
    <p style="text-align:center"><em>Приятелям по рассеянью</em></p>
  </li>
  <li>Люблю я&nbsp;дружеские враки</li>
  <li>И дружеский бокал вина</li>
  <li>Порою той, что названа</li>
  <li>Пора меж волка и&nbsp;собаки.</li>
  <li class="indent-7">
    <p><em>Пушкин</em></p>
  </li>
  <li>Молодой человек был охотник.</li>
  <li class="indent-7"><em>Пастернак</em></li>
</ul>
